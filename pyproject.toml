[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urducx-bench"
version = "0.0.0"
description = "Evaluation tools for Urdu and Roman Urdu customer-service language models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "certifi==2026.7.22",
    "google-play-scraper==1.2.7",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# page.py holds the adjudication interface as one self-contained HTML/JS document, so
# the file never leaves the machine serving it. Wrapping lines inside that blob to satisfy
# a Python line limit would make the JavaScript harder to read, not easier.
"src/adjudicate/page.py" = ["E501"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
